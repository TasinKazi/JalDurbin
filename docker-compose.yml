services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: jaldurbin-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jaldurbin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jaldurbin_secret}
      POSTGRES_DB: ${POSTGRES_DB:-jaldurbin_gis}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jaldurbin} -d ${POSTGRES_DB:-jaldurbin_gis}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jaldurbin-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./data:/data
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jaldurbin}:${POSTGRES_PASSWORD:-jaldurbin_secret}@postgis:5432/${POSTGRES_DB:-jaldurbin_gis}
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jaldurbin-frontend
    restart: unless-stopped
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgis_data:
